; MySQL 连接配置
; 支持两种格式：
;
; 格式1 — 单独字段（推荐）:
; [连接名]
; host=ip地址
; port=3306
; user=用户名
; password=密码
;
; 格式2 — JDBC URL:
; [连接名]
; url=jdbc:mysql://ip地址:端口/?参数1=值1&参数2=值2
; user=用户名
; password=密码
;
; 如果同时填写 host/port 和 url，url 优先

[本地开发库]
host=127.0.0.1
port=3306
user=root
password=root

[阿里云RDS_生产]
url=jdbc:mysql://rm-bp1xxxxx.mysql.rds.aliyuncs.com:3306/?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false
user=admin
password=your_password_here

[测试环境]
host=192.168.1.100
port=3306
user=test_user
password=test_pass
